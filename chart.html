<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deriv Bot — Clon Educativo</title>
<style>
  :root{
    --red: #ff444f;
    --red-dark: #e0323d;
    --teal: #00a79e;
    --teal-dark: #048f87;
    --green: #1fb27a;
    --ink: #1a1d1f;
    --gray-700: #4a5257;
    --gray-500: #7c8688;
    --gray-300: #c7cdce;
    --gray-200: #e4e8e8;
    --gray-100: #f2f4f4;
    --line: #e9ecec;
    --page-bg: #eef1f1;
    --card-bg: #ffffff;
    --shadow: 0 20px 50px -20px rgba(20,30,30,0.35);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 28px 14px;
    color: var(--ink);
  }
  .app-shell{ width: 100%; max-width: 412px; }
  .phone{
    background: var(--card-bg);
    border-radius: 28px;
    overflow:hidden;
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    height: min(860px, 82vh);
    min-height: 600px;
    position:relative;
  }
 
  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line);
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .logo{
    width:34px; height:34px; border-radius:9px;
    background: var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; flex-shrink:0;
  }
  .account-info{ display:flex; flex-direction:column; gap:2px; line-height:1; cursor:pointer; border:none; background:none; padding:0; text-align:left; font-family:inherit; }
  .account-type{ display:flex; align-items:center; gap:3px; color: var(--teal); font-weight:600; font-size:13px; }
  .account-type svg{ width:12px; height:12px; }
  .balance{ font-weight:700; font-size:16px; color: var(--ink); }
  .deposit-btn{
    background: var(--red); color:#fff; border:none;
    font-weight:700; font-size:14px;
    padding: 9px 20px; border-radius: 999px; cursor:pointer;
    transition: background .15s ease, transform .1s ease;
    font-family:inherit;
  }
  .deposit-btn:hover{ background: var(--red-dark); }
  .deposit-btn:active{ transform: scale(0.96); }
 
  /* ---------- tarjeta del instrumento ---------- */
  .instrument{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding: 12px 16px; gap:10px;
    border:none; background:none; border-bottom: 1px solid var(--line);
    cursor:pointer; font-family:inherit; text-align:left;
  }
  .instrument-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .instrument-icon{
    width:34px; height:34px; border-radius:9px;
    background: linear-gradient(135deg,#eef7f6,#e3f1ef);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .instrument-icon svg{ width:20px; height:20px; }
  .instrument-name{ font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap; }
  .instrument-meta{ display:flex; align-items:center; gap:5px; font-size:12.5px; margin-top:2px; }
  .instrument-price{ color: var(--gray-700); font-variant-numeric: tabular-nums; }
  .instrument-change{ display:flex; align-items:center; gap:2px; font-weight:600; font-variant-numeric: tabular-nums; }
  .instrument-change.up{ color: var(--green); }
  .instrument-change.down{ color: var(--red); }
  .instrument-change svg{ width:9px; height:9px; }
  .chev{ color: var(--gray-500); flex-shrink:0; }
 
  /* ---------- grafico ---------- */
  .chart-wrap{ position:relative; flex:1; min-height: 220px; background: var(--card-bg); }
  canvas#chart{ display:block; width:100%; height:100%; }
  .live-indicator{
    position:absolute; left:12px; top:12px;
    display:flex; align-items:center;
    background: rgba(255,255,255,0.92);
    border:1px solid var(--gray-200);
    padding:4px 10px 4px 8px; border-radius:999px;
    font-size:11px; font-weight:600; color:var(--gray-700);
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .live-dot{ width:6px; height:6px; border-radius:50%; background: var(--gray-300); display:inline-block; margin-right:5px; flex-shrink:0; }
  .live-dot.live{ background: var(--green); box-shadow:0 0 0 3px rgba(31,178,122,0.18); }
  .live-dot.sim{ background:#e0a800; box-shadow:0 0 0 3px rgba(224,168,0,0.18); }
  .price-tag{
    position:absolute; right:10px; transform: translateY(-50%);
    background: var(--ink); color:#fff; font-weight:700; font-size:13px;
    font-variant-numeric: tabular-nums; padding: 5px 9px; border-radius: 6px;
    pointer-events:none; white-space:nowrap; transition: top .25s linear;
  }
  .chart-controls{ position:absolute; left:12px; bottom:12px; display:flex; gap:8px; }
  .chip-btn{
    background: rgba(255,255,255,0.9); border: 1px solid var(--gray-200);
    color: var(--gray-700); font-weight:700; font-size:12px;
    width:30px; height:30px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); font-family:inherit;
  }
  .chip-btn:hover{ background:#fff; border-color: var(--gray-300); }
  .chip-btn svg{ width:15px; height:15px; }
 
  .expand-row{
    display:flex; align-items:center; justify-content:center; width:100%;
    padding:8px 0; border:none; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    cursor:pointer; color: var(--gray-500); background:none;
  }
  .expand-row svg{ width:16px; height:16px; transition: transform .2s ease; }
  .expand-row.collapsed svg{ transform: rotate(180deg); }
 
  /* ---------- seccion run ---------- */
  .run-section{ display:flex; align-items:center; gap:14px; padding: 14px 16px; }
  .run-btn{
    display:flex; align-items:center; gap:7px;
    background: var(--teal); color:#fff; border:none;
    font-weight:700; font-size:14.5px;
    padding: 11px 20px 11px 16px; border-radius: 999px; cursor:pointer;
    flex-shrink:0; transition: background .15s ease, transform .1s ease;
    font-family:inherit;
  }
  .run-btn svg{ width:13px; height:13px; }
  .run-btn:hover{ background: var(--teal-dark); }
  .run-btn:active{ transform: scale(0.97); }
  .run-btn.running{ background: var(--red); }
  .run-btn.running:hover{ background: var(--red-dark); }
 
  .bot-status{ flex:1; min-width:0; }
  .status-text{ font-size:13px; font-weight:600; color: var(--gray-700); margin-bottom:8px; }
  .status-text.running{ color: var(--teal-dark); }
  .progress-track{ position:relative; height:4px; border-radius:999px; background: var(--gray-200); overflow:hidden; }
  .progress-fill{ position:absolute; top:0; bottom:0; left:0; right:100%; background: linear-gradient(90deg, var(--teal), var(--teal-dark)); border-radius:999px; }
  .progress-fill.running{ animation: indet 1.4s ease-in-out infinite; }
  @keyframes indet{
    0%{ left:-40%; right:100%; }
    50%{ left:60%; right:-10%; }
    100%{ left:110%; right:-100%; }
  }
 
  /* ---------- navegacion inferior ---------- */
  .bottom-nav{ display:flex; border-top:1px solid var(--line); padding: 8px 4px 12px; }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 2px; color: var(--gray-500); cursor:pointer;
    font-size:10.5px; font-weight:600; border:none; background:none; font-family:inherit;
  }
  .nav-item svg{ width:20px; height:20px; }
  .nav-item.active{ color: var(--red); }
  .nav-item:hover{ color: var(--ink); }
  .nav-item.active:hover{ color: var(--red); }
 
  .caption{ text-align:center; color: var(--gray-500); font-size:11.5px; line-height:1.5; max-width:380px; margin: 16px auto 0; }
  .caption b{ color: var(--gray-700); }
 
  .toast{
    position:fixed; left:50%; bottom:24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color:#fff; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
 
  @media (max-width: 420px){
    body{ padding:0; }
    .app-shell{ max-width:100%; }
    .phone{ border-radius:0; height:100vh; min-height:100vh; box-shadow:none; }
    .caption{ padding: 10px 16px 4px; }
  }
  @media (prefers-reduced-motion: reduce){
    .progress-fill.running{ animation:none; }
    *{ transition:none !important; }
  }
</style>
</head>

<script>
(function(){
  /* =========================================================
     CONFIGURACION DE LA API DE DERIV
     - Endpoint oficial de WebSocket v3
     - app_id 1089 es el ID público de demostración que Deriv
       documenta en sus propios ejemplos (developers.deriv.com)
     - Simbolo "1HZ100V" = Volatility 100 (1s) Index
     ========================================================= */
  var APP_ID = 1089;
  var SYMBOL = '1HZ100V';
  var WS_URL = 'wss://ws.derivws.com/websockets/v3?app_id=' + APP_ID;
 
  var MAX_POINTS = 55;
  var points = [];               // {t: epoch_ms, p: price}
  var lastPrice = 736.04;
  var referencePrice = 735.86;
  var ws = null;
  var simTimer = null;
 
  var canvas = document.getElementById('chart');
  var ctx = canvas.getContext('2d');
  var priceTag = document.getElementById('priceTag');
  var metaPrice = document.getElementById('metaPrice');
  var metaChange = document.getElementById('metaChange');
  var liveDot = document.getElementById('liveDot');
  var liveLabel = document.getElementById('liveLabel');
  var toastEl = document.getElementById('toast');
 
  function fmt(n){ return n.toFixed(2); }
 
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
 
  function setLiveStatus(mode){
    liveDot.classList.remove('live','sim');
    if(mode === 'live'){ liveDot.classList.add('live'); liveLabel.textContent = 'En vivo · Deriv API'; }
    else if(mode === 'sim'){ liveDot.classList.add('sim'); liveLabel.textContent = 'Simulado (demo)'; }
    else { liveLabel.textContent = 'Conectando…'; }
  }
 
  /* ---------- canvas: tamaño y escala ---------- */
  function resizeCanvas(){
    var rect = canvas.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  window.addEventListener('resize', resizeCanvas);
 
  /* ---------- dibujar el grafico (area + linea) ---------- */
  function draw(){
    var rect = canvas.parentElement.getBoundingClientRect();
    var W = rect.width, H = rect.height;
    ctx.clearRect(0,0,W,H);
    if(points.length < 2) return;
 
    var padTop = 20, padBottom = 24, padRight = 52, padLeft = 10;
    var prices = points.map(function(pt){ return pt.p; });
    var min = Math.min.apply(null, prices);
    var max = Math.max.apply(null, prices);
    if(min === max){ min -= 0.05; max += 0.05; }
    var span = max - min;
    min -= span * 0.15; max += span * 0.15; span = max - min;
 
    var plotW = W - padLeft - padRight;
    var plotH = H - padTop - padBottom;
 
    function xAt(i){ return padLeft + (i/(points.length-1)) * plotW; }
    function yAt(p){ return padTop + (1 - (p - min)/span) * plotH; }
 
    // cuadricula + etiquetas del eje Y
    var steps = 6;
    ctx.strokeStyle = '#eef1f1';
    ctx.lineWidth = 1;
    ctx.font = '10px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#9aa3a5';
    ctx.textBaseline = 'middle';
    for(var s=0; s<=steps; s++){
      var gp = min + (span*s/steps);
      var gy = yAt(gp);
      ctx.beginPath();
      ctx.moveTo(padLeft, gy);
      ctx.lineTo(W - padRight + 6, gy);
      ctx.stroke();
      ctx.fillText(fmt(gp), W - padRight + 10, gy);
    }
 
    // etiquetas del eje X (hora UTC, como el servidor de Deriv)
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    var xTickEvery = Math.max(1, Math.floor(points.length/5));
    for(var i=0;i<points.length;i+=xTickEvery){
      var d = new Date(points[i].t);
      var lbl = d.toISOString().slice(11,19);
      ctx.fillText(lbl, xAt(i), H - 7);
    }
    ctx.textAlign = 'left';
 
    // area rellena bajo la linea
    ctx.beginPath();
    points.forEach(function(pt,i){
      var x = xAt(i), y = yAt(pt.p);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    var lastX = xAt(points.length-1);
    ctx.lineTo(lastX, padTop+plotH);
    ctx.lineTo(padLeft, padTop+plotH);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0,padTop,0,padTop+plotH);
    grad.addColorStop(0,'rgba(20,25,25,0.10)');
    grad.addColorStop(1,'rgba(20,25,25,0)');
    ctx.fillStyle = grad;
    ctx.fill();
 
    // linea principal
    ctx.beginPath();
    points.forEach(function(pt,i){
      var x = xAt(i), y = yAt(pt.p);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle = '#26292b';
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.stroke();
 
    // punto final + guia punteada hacia la etiqueta de precio
    var lastY = yAt(points[points.length-1].p);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(W - padRight + 6, lastY);
    ctx.strokeStyle = '#c7cdce';
    ctx.setLineDash([2,3]);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
 
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3.4, 0, Math.PI*2);
    ctx.fillStyle = '#26292b';
    ctx.fill();
 
    priceTag.style.top = lastY + 'px';
  }
 
  /* ---------- procesar cada nuevo precio (real o simulado) ---------- */
  function handleTick(price, epochMs){
    lastPrice = price;
    points.push({t: epochMs, p: price});
    if(points.length > MAX_POINTS) points.shift();
 
    priceTag.textContent = fmt(price);
    metaPrice.textContent = fmt(price);
 
    var change = price - referencePrice;
    var pct = (change/referencePrice)*100;
    var up = change >= 0;
    metaChange.classList.toggle('up', up);
    metaChange.classList.toggle('down', !up);
    metaChange.innerHTML = (up?'':'-') + Math.abs(change).toFixed(2) + ' (' + Math.abs(pct).toFixed(2) + '%) ' +
      '<svg viewBox="0 0 24 24" fill="currentColor">' + (up ? '<path d="M12 5l7 12H5z"/>' : '<path d="M12 19L5 7h14z"/>') + '</svg>';
 
    draw();
  }
 
  /* ---------- conexion real a la API de Deriv (WebSocket publico) ---------- */
  function connectDeriv(){
    try{
      ws = new WebSocket(WS_URL);
    }catch(e){ startSimulation(); return; }
 
    var gotFirstTick = false;
    var giveUp = setTimeout(function(){
      if(!gotFirstTick){ try{ ws.close(); }catch(e){} startSimulation(); }
    }, 4500);
 
    ws.onopen = function(){
      // Suscripcion al flujo de precios (ticks) del simbolo elegido
      ws.send(JSON.stringify({ ticks: SYMBOL, subscribe: 1 }));
    };
    ws.onmessage = function(evt){
      var data;
      try{ data = JSON.parse(evt.data); }catch(e){ return; }
      if(data.msg_type === 'tick' && data.tick){
        gotFirstTick = true;
        clearTimeout(giveUp);
        setLiveStatus('live');
        handleTick(parseFloat(data.tick.quote), data.tick.epoch*1000);
      } else if(data.error){
        clearTimeout(giveUp);
        startSimulation();
      }
    };
    ws.onerror = function(){ clearTimeout(giveUp); if(!gotFirstTick) startSimulation(); };
    ws.onclose = function(){ if(!gotFirstTick) startSimulation(); };
  }
 
  /* ---------- respaldo: simulacion local si la API no esta disponible ---------- */
  function startSimulation(){
    if(simTimer) return;
    setLiveStatus('sim');
    simTimer = setInterval(function(){
      var delta = (Math.random()-0.5) * 0.09;
      var next = Math.max(0.01, lastPrice + delta);
      handleTick(next, Date.now());
    }, 700);
  }
 
  /* ---------- semilla inicial (misma forma que la captura de referencia) ---------- */
  var now = Date.now();
  var seed = [735.86,735.94,735.75,736.13,736.07,736.11,735.96,736.04];
  seed.forEach(function(p, i){ points.push({ t: now - (seed.length-i)*5000, p: p }); });
  lastPrice = seed[seed.length-1];
  referencePrice = seed[0];
 
  resizeCanvas();
  connectDeriv();
 
  window.addEventListener('beforeunload', function(){
    if(ws){ try{ ws.close(); }catch(e){} }
    if(simTimer) clearInterval(simTimer);
  });
 
  /* ---------- boton Run: alterna el estado visual del bot ---------- */
  var running = false;
  var runBtn = document.getElementById('runBtn');
  var runLabel = document.getElementById('runLabel');
  var runIcon = document.getElementById('runIcon');
  var statusText = document.getElementById('statusText');
  var progressFill = document.getElementById('progressFill');
 
  runBtn.addEventListener('click', function(){
    running = !running;
    runBtn.classList.toggle('running', running);
    statusText.classList.toggle('running', running);
    progressFill.classList.toggle('running', running);
    statusText.textContent = running ? 'Bot is running' : 'Bot is not running';
    runLabel.textContent = running ? 'Stop' : 'Run';
    runIcon.innerHTML = running
      ? '<rect x="6" y="6" width="12" height="12" rx="2"/>'
      : '<path d="M8 5v14l11-7z"/>';
    toast(running ? 'Bot iniciado (demo visual, no opera dinero real)' : 'Bot detenido');
  });
 
  /* ---------- elementos decorativos (fieles al diseño, sin backend real) ---------- */
  ['depositBtn','instrumentCard','tickBtn','settingsBtn'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.addEventListener('click', function(){ toast('Función deshabilitada en este demo educativo'); });
  });
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.addEventListener('click', function(){
      if(el.classList.contains('active')) return;
      toast(el.dataset.name + ' — no disponible en este demo');
    });
  });
  document.getElementById('expandRow').addEventListener('click', function(){
    this.classList.toggle('collapsed');
  });
 
})();
</script>
</body>
</html>
