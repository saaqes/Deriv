services:
  - type: web
    name: tradelab-bot
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_DERIV_APP_ID
        sync: false
      - key: NEXT_PUBLIC_DERIV_APP_NAME
        value: Dreiv Vot
      - key: NEXT_PUBLIC_DERIV_ENV
        value: production
      - key: NEXT_PUBLIC_DERIV_REFERRAL_LINK
        sync: false
      - key: NEXT_PUBLIC_DERIV_OAUTH_SCOPES
        value: trade
    routes:
      # SPA fallback: cualquier ruta que no sea un archivo real (home.html,
      # options.html, assets/*, etc.) cae en la app de React.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      # CORRECCIÓN: en el teléfono la operación seguía "cargando" como antes
      # del último arreglo porque el navegador/PWA del celular tenía
      # cacheado el index.html viejo, el cual apunta a los archivos .js con
      # el código ANTERIOR (sin el arreglo de compra/venta). El navegador de
      # escritorio normalmente revalida más seguido y por eso ya mostraba el
      # cambio. Forzamos a que index.html NUNCA se sirva desde caché, para
      # que cualquier dispositivo (celular incluido) reciba siempre la
      # versión más reciente de la app en cuanto se vuelva a cargar.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
